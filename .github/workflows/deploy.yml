name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deployment
        run: |
          curl -s -X POST \
            "https://api.vercel.com/v1/integrations/deploy/prj_VK2AtGlBVnyYIte8S5AqzksAXADm/V49VyYr1ET" \
            | grep -o '"state":"[^"]*"' || true
